{% extends "base.html" %}

{% block title %}Register - Personal Blog{% endblock %}

{% block content %}
<div class="create-blog-container" style="margin-top: 4rem; margin-bottom: 4rem;">
    <div class="create-blog-form" style="max-width: 400px; margin: 0 auto;">
        <h1 style="text-align: center; margin-bottom: 2rem;">Create Account</h1>
        
        <form method="POST" style="width: 100%;">
            <div class="form-group">
                <label for="name">Username</label>
                <input type="text" id="name" name="name" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a strong password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create Account</button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-light);">
            Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--primary-color); font-weight: 600;">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
